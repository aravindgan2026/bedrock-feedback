<title>Bedrock</title><style>
:root{--ink:#2B1D12;--soft:#7A6857;--faint:#A89A8C;--or:#FF4D00;--bg:#F7EFE6;--card:#FFFDFA;--tint:#FBF4EC;--line:#EFE6DB}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding:20px 14px 48px}.wm{text-align:center;font-weight:700;font-size:20px;letter-spacing:-.4px;margin:6px 0 18px}.wm i{color:var(--or);font-style:normal}
.box{background:var(--card);border-radius:22px;overflow:hidden;padding-bottom:28px}section{padding:30px 28px 0}.c{text-align:center}.s{color:var(--soft);font-size:15px}.f{color:var(--faint);font-size:13px}
a{color:var(--or);text-decoration:none}h2{font-size:23px;letter-spacing:-.5px;margin:0 0 4px;text-align:center}
.hero{position:relative}.hero img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}.ht{position:absolute;left:0;right:0;bottom:0;padding:60px 24px 18px;background:linear-gradient(transparent,rgba(20,12,6,.72));color:#fff}
.ht h1{margin:2px 0 0;font-size:36px;letter-spacing:-1px;line-height:1.1}.eb{font-size:13px;opacity:.92}.sub{opacity:.9}
.hi{font-size:18px;font-weight:600;margin:0}.lead{font-size:18px;color:var(--soft);margin:6px 0 0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.steps div{background:var(--tint);border-radius:14px;padding:14px 8px;text-align:center}
.steps i{display:block;color:var(--or);font-style:normal;font-weight:700;font-size:12px}.steps b{display:block}.steps big{display:block;font-size:20px;font-weight:700;margin:4px 0 2px;white-space:nowrap}.steps span{font-size:13px;color:var(--soft)}
figure{margin:0}figure img{width:100%;display:block;border-radius:12px;aspect-ratio:4/3;object-fit:cover}figcaption{font-size:12px;color:var(--faint);text-align:center;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.solds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.sold img{width:100%;border-radius:12px;aspect-ratio:4/3;object-fit:cover;display:block}.sp{font-size:20px;font-weight:700;margin-top:6px}.sa{font-size:14px}.sn{font-size:12px;color:var(--faint)}
.sandra{display:flex;gap:14px;background:var(--tint);border-radius:16px;padding:18px;margin-top:10px}.sandra img{width:68px;height:68px;border-radius:50%;flex:none}.sandra p{margin:8px 0 0;font-size:15px}
.big{font-size:72px;font-weight:700;letter-spacing:-3px;color:var(--or);line-height:1}.bigl{font-weight:600;margin-top:6px}
.bars{text-align:left;margin-top:14px}.bl{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--soft);margin-top:12px}.bt{height:10px;border-radius:5px;margin-top:6px}.bt div{height:10px;border-radius:5px}
table{width:100%;border-collapse:collapse}.pay td,.bad td{padding:12px 0;border-bottom:1px solid var(--line)}.r{text-align:right;white-space:nowrap}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.tiles div{background:var(--tint);border-radius:16px;padding:18px 8px;text-align:center;font-size:13px;color:var(--soft)}.tiles big{display:block;font-size:28px;font-weight:700;letter-spacing:-1px;color:var(--ink);margin:4px 0}
.tiles .hot{background:var(--or);color:rgba(255,255,255,.9)}.tiles .hot big{color:#fff}
.bad{border:1.5px solid #E6D8C8;border-radius:16px;padding:18px 20px;margin-top:12px}.bad .tot td{border:0;font-weight:600}.bad .tot .r{font-size:24px;font-weight:700}
details{border-bottom:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:600}details p{color:var(--soft);font-size:15px;margin:8px 0 0}
.btn{display:inline-block;background:var(--or);color:#fff;font-weight:600;font-size:17px;padding:15px 36px;border-radius:999px;margin-top:14px}
.pill{display:inline-block;border:1.5px solid var(--or);border-radius:999px;padding:9px 16px;margin:5px 4px 0;font-weight:600;white-space:nowrap}
.sig{color:var(--soft);margin-top:36px}footer{font-size:11px;line-height:16px;color:var(--faint);text-align:center;padding:24px 18px 0}
#msg{text-align:center;color:var(--soft);padding:80px 20px}
@media(max-width:560px){section{padding:26px 18px 0}.steps,.solds{grid-template-columns:1fr}.gal{grid-template-columns:1fr 1fr}.gal figure:last-child:nth-child(odd){grid-column:1/-1}.gal figure:last-child:nth-child(odd) img{aspect-ratio:16/9}.ht h1{font-size:30px}}
