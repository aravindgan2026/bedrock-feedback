<title>Bedrock</title><style>
:root{--ink:#1D1712;--soft:#6F6258;--faint:#A1958A;--or:#FF4D00;--or2:#FFB088;--bg:#FBF7F2;--card:#fff;--tint:#F5EDE4;--line:#ECE3D9;--seg:#EFE6DC}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:var(--or);text-decoration:none}.c{text-align:center}.tiny{font-size:13px;color:var(--faint)}
.nav{position:sticky;top:0;z-index:6;height:52px;display:flex;align-items:center;justify-content:center;background:rgba(251,247,242,.82);backdrop-filter:saturate(1.8) blur(18px);-webkit-backdrop-filter:saturate(1.8) blur(18px);border-bottom:1px solid rgba(0,0,0,.06)}.nav img{height:26px;width:auto;display:block}
#msg{text-align:center;color:var(--soft);padding:120px 24px;max-width:520px;margin:0 auto}
.hero{position:relative;height:min(92vh,760px);min-height:520px;overflow:hidden;background:#3a2a1e}
.hero img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04);animation:zoom 9s ease-out forwards}
@keyframes zoom{to{transform:scale(1)}}
.ht{position:absolute;left:0;right:0;bottom:0;padding:120px 24px 44px;background:linear-gradient(transparent,rgba(16,10,5,.78));color:#fff;text-align:center}
.tag{display:inline-block;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
.ht h1{margin:14px 0 8px;font-size:clamp(38px,9vw,68px);line-height:1.04;letter-spacing:-.035em;font-weight:700}.sub{opacity:.88;font-size:17px}
section{max-width:720px;margin:0 auto;padding:76px 22px 0}
.eb{color:var(--or);font-weight:600;font-size:15px;text-align:center;margin-bottom:6px}
h2{font-size:clamp(30px,6.6vw,46px);line-height:1.08;letter-spacing:-.03em;margin:0 0 10px;text-align:center;font-weight:700}
.sub2{color:var(--soft);text-align:center;margin:0 auto 18px;max-width:560px}
.intro .hi{font-size:26px;font-weight:700;letter-spacing:-.02em;text-align:center;margin:0}
.intro .lead{font-size:20px;line-height:1.45;color:var(--soft);text-align:center;margin:10px auto 0;max-width:600px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}
.three div{background:var(--card);border-radius:22px;padding:22px 18px;box-shadow:0 1px 2px rgba(60,40,20,.05),0 8px 24px rgba(60,40,20,.06)}
.three i svg,.flow i{width:30px;height:30px}.three i svg{fill:none;stroke:var(--or);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.three b{display:block;margin-top:12px;font-size:18px;letter-spacing:-.01em}.three span{display:block;color:var(--soft);font-size:15px;margin-top:4px;line-height:1.4}
.card{background:var(--card);border-radius:30px;padding:30px 26px 26px;margin-top:22px;box-shadow:0 1px 2px rgba(60,40,20,.05),0 18px 50px rgba(60,40,20,.10)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.lbl{color:var(--soft);font-size:16px;font-weight:600}
.put{font-size:clamp(30px,7vw,40px);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:4px;margin:18px 0 6px;background:linear-gradient(90deg,var(--or) var(--p,50%),var(--seg) var(--p,50%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.04);cursor:pointer}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.22);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.chips button,.seg button{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.chips button{background:var(--tint);color:var(--ink);border-radius:999px;padding:8px 15px;font-size:15px;font-weight:600}.chips button.on{background:var(--ink);color:#fff}
.arrow{text-align:center;color:var(--faint);font-size:22px;margin:16px 0 2px}
.get{font-size:clamp(50px,14vw,84px);font-weight:700;letter-spacing:-.045em;line-height:1.02;text-align:center;color:var(--or);font-variant-numeric:tabular-nums;margin-top:4px}
.gain{text-align:center;font-weight:700;font-size:18px;color:#1E8E3E;margin-top:6px}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:22px 0 6px;background:var(--seg)}
.stack div{height:100%;transition:width .45s cubic-bezier(.2,.8,.2,1)}.s1{background:#D8CCBF}.s2{background:var(--or2)}.s3{background:var(--or)}
.legend{width:100%;border-collapse:collapse;font-size:15px}.legend td{padding:7px 0;border-bottom:1px solid var(--line)}.legend tr:last-child td{border:0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:9px;vertical-align:0}.d1{background:#D8CCBF}.d2{background:var(--or2)}.d3{background:var(--or)}
.r{text-align:right;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
.q{font-size:14px;font-weight:600;color:var(--soft);margin:20px 0 8px}
.seg{display:flex;background:var(--seg);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;background:transparent;border-radius:10px;padding:10px 4px;font-size:15px;font-weight:600;color:var(--soft);line-height:1.2}
.seg button small{display:block;font-size:12px;font-weight:500;color:var(--faint)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.why{font-size:16px;line-height:1.45;margin:18px 0 6px;padding:14px 16px;background:var(--tint);border-radius:16px}
.note{text-align:center;color:var(--soft);font-size:15px;margin:16px auto 0;max-width:560px}
.tl{display:flex;align-items:flex-end;gap:5px;height:190px;margin-top:20px;padding:0 2px}
.tl button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;background:none;border:0;padding:0;cursor:pointer;font:inherit;-webkit-tap-highlight-color:transparent}
.tl .b{width:100%;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--or),#FF7A3D);transition:height .5s cubic-bezier(.2,.8,.2,1),background .3s,opacity .3s}
.tl button.off .b{background:var(--seg)}.tl button.sel .b{box-shadow:0 0 0 3px rgba(255,77,0,.25)}
.tl .ml{font-size:11px;color:var(--faint);margin-top:6px;font-weight:600}.tl .yr{font-size:10px;color:var(--faint);height:13px}
.tlnote{text-align:center;font-size:17px;margin-top:16px;min-height:52px}.tlnote b{font-variant-numeric:tabular-nums}
.flow{display:flex;align-items:stretch;gap:8px;margin-top:22px}
.flow>div:not(.ar){flex:1;background:var(--card);border-radius:22px;padding:20px 10px;text-align:center;box-shadow:0 8px 24px rgba(60,40,20,.06)}
.flow .ar{display:flex;align-items:center;color:var(--faint);font-size:20px}
.flow i{display:inline-block;width:26px;height:26px;line-height:26px;border-radius:50%;background:var(--tint);color:var(--or);font-style:normal;font-weight:700;font-size:13px}
.flow b{display:block;margin-top:8px}.flow big{display:block;font-size:clamp(20px,4.6vw,26px);font-weight:700;letter-spacing:-.02em;margin:4px 0}.flow span{font-size:13px;color:var(--soft);line-height:1.35;display:block}
.flow .hot{background:var(--or)!important;color:#fff}.flow .hot span{color:rgba(255,255,255,.88)}.flow .hot i{background:rgba(255,255,255,.22);color:#fff}
.gal{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 22px 10px;margin:0 -22px;scrollbar-width:none}.gal::-webkit-scrollbar{display:none}
.gal figure{flex:0 0 min(78%,340px);margin:0;scroll-snap-align:center}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;display:block;background:var(--tint)}
figcaption{font-size:13px;color:var(--faint);text-align:center;margin-top:6px}
.solds{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.sold img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;display:block;background:var(--tint)}
.sp{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:8px}.sa{font-size:15px}.sn{font-size:13px;color:var(--faint)}
.sandra{display:flex;gap:16px;background:var(--card);border-radius:24px;padding:22px;margin-top:18px;box-shadow:0 8px 24px rgba(60,40,20,.06)}
.sandra img{width:76px;height:76px;border-radius:50%;object-fit:cover;flex:none}.sandra b{font-size:18px}.sandra p{margin:10px 0 0;font-size:16px;color:var(--soft)}
.big{font-size:clamp(72px,20vw,120px);font-weight:700;letter-spacing:-.05em;color:var(--or);line-height:1}.bigl{font-weight:600;font-size:19px;margin-top:6px}
.bars{text-align:left;margin-top:18px}.bl{display:flex;justify-content:space-between;gap:10px;font-size:15px;color:var(--soft);margin-top:14px}
.bt{height:12px;border-radius:6px;margin-top:6px;background:var(--seg)}.bt div{height:12px;border-radius:6px;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
details{border-bottom:1px solid var(--line);padding:16px 2px}summary{cursor:pointer;font-weight:600;font-size:18px;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}summary:after{content:'+';color:var(--or);font-size:22px;line-height:1}details[open] summary:after{content:'\2013'}details p{color:var(--soft);margin:10px 0 0}
.cta{padding-bottom:20px}.btn{display:inline-block;background:var(--or);color:#fff;font-weight:600;font-size:18px;padding:17px 40px;border-radius:999px;margin-top:10px;box-shadow:0 8px 22px rgba(255,77,0,.28)}
.btn.sm{font-size:16px;padding:12px 22px;margin:0;box-shadow:none}
.pill{display:inline-block;border:1.5px solid var(--or);border-radius:999px;padding:10px 17px;margin:6px 4px 0;font-weight:600;white-space:nowrap}
.sig{color:var(--soft);margin-top:40px}footer{font-size:11px;line-height:16px;color:var(--faint);text-align:center;max-width:720px;margin:0 auto;padding:30px 22px 130px}
.sb{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
 background:rgba(255,255,255,.86);backdrop-filter:saturate(1.8) blur(18px);-webkit-backdrop-filter:saturate(1.8) blur(18px);border-radius:20px;padding:10px 10px 10px 18px;
 box-shadow:0 10px 34px rgba(40,25,10,.18);transform:translateY(160%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:5}
.sb.show{transform:none}.sb>div{display:flex;flex-direction:column;line-height:1.2}.sb>div b:last-child{font-size:19px;color:var(--or);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

@media(max-width:600px){section{padding:60px 18px 0}.three{grid-template-columns:1fr}.three div{display:grid;grid-template-columns:34px 1fr;column-gap:12px;padding:18px}
 .three i{grid-row:span 2}.three b{margin-top:2px}.card{padding:24px 18px 20px;border-radius:26px}.solds{grid-template-columns:1fr}.flow{flex-direction:column}.flow .ar{justify-content:center;transform:rotate(90deg);height:18px}
 .gal{padding:4px 18px 10px;margin:0 -18px}.seg button{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.rv{opacity:1;transform:none}}

const PX='https://dtybhuhcuqybjipnfgcg.supabase.co/functions/v1/px/';
const ping=t=>{if(/^[0-9a-f]{32}$/.test(t||''))(new Image()).src=PX+t+'.gif?'+Date.now();};
const b64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sha=async s=>new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));
const hex=b=>Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
const open_=async(raw,blob)=>{const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(blob.iv)},k,b64(blob.ct)));};
async function who(){const i=(new URLSearchParams(location.search).get('i')||'').trim();
 if(i){const b=DATA.p[hex(await sha('id:'+i)).slice(0,16)];if(!b)throw 0;return JSON.parse(await open_(await sha('key:'+i),b));}
 const h=new URLSearchParams(location.hash.slice(1));if(h.get('k'))return Object.fromEntries(h);throw 0;}
// ---- money math: whole shares, the card record's monthly payout steps (same method as the email numbers) ----
const r2=x=>Number(x.toFixed(2));   // rounds the exact stored value, same as Python round()
const usd=(x,c)=>'$'+x.toLocaleString('en-US',c===0?{maximumFractionDigits:0}:{minimumFractionDigits:2,maximumFractionDigits:2});
function calc(C,a,price,n){const sh=Math.floor(a/C.price+1e-9),p=sh/10000,d=C.dists;
 const mon=[d[0],d[0],d[1],d[1],d[2],d[2],d[3],d[3],d[3],d[3],d[3],d[3]].map(x=>r2(p*x));
 const pay=r2(mon.slice(0,n).reduce((s,x)=>s+x,0)),cost=r2(sh*C.price),share=r2(p*C.scen[price][n]);
 return {sh,cost,mon,pay,share,total:r2(cost+pay+share)};}
function tween(el,to,fmt){const from=el._cur??to,id=(el._id||0)+1;el._id=id;if(matchMedia('(prefers-reduced-motion:reduce)').matches||from===to){el._cur=to;el.textContent=fmt(to);return;}
 const t0=performance.now(),D=450;const step=t=>{if(el._id!==id)return;const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el._cur=k<1?from+(to-from)*e:to;el.textContent=fmt(k<1?r2(el._cur):to);if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}
function interactive(P){const C=JSON.parse(document.getElementById('cfg').textContent);const $=id=>document.getElementById(id);
 const prices=Object.keys(C.scen).map(Number).sort((a,b)=>b-a),mons=[6,9,12];let a=C.amount,pr=prices[0],n=6,sel=null;
 const rng=$('amt');rng.min=C.min;rng.max=C.max;rng.step=C.step;rng.value=a;
 $('chips').innerHTML=C.chips.map(v=>`<button data-v="${v}">${usd(v,0)}</button>`).join('');
 $('segp').innerHTML=prices.map((v,i)=>`<button data-p="${v}">${usd(v,0)}<small>${i?'20% less':'the plan'}</small></button>`).join('');
 $('segm').innerHTML=mons.map(v=>`<button data-m="${v}">${C.when[v]}</button>`).join('');
 const tl=$('tl'),hmax=Math.max(...C.dists);
 tl.innerHTML=C.months.map((mo,i)=>`<button data-i="${i}"><span class="yr">${i===0?'2026':i===1?'2027':''}</span><span class="b"></span><span class="ml">${mo}</span></button>`).join('');
 const res=()=>{const v=calc(C,a,pr,n);
  $('put').textContent=usd(a,0);rng.style.setProperty('--p',((a-C.min)/(C.max-C.min)*100)+'%');
  document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',+b.dataset.v===a));
  document.querySelectorAll('#segp button').forEach(b=>b.classList.toggle('on',+b.dataset.p===pr));
  document.querySelectorAll('#segm button').forEach(b=>b.classList.toggle('on',+b.dataset.m===n));
  tween($('get'),v.total,x=>usd(x));$('gain').textContent='+'+usd(r2(v.total-v.cost))+' more than you put in';
  const W=x=>(x/v.total*100)+'%';const s=$('stack').children;s[0].style.width=W(v.cost);s[1].style.width=W(v.pay);s[2].style.width=W(v.share);
  $('l1').textContent=usd(v.cost);$('l2t').textContent=n+' monthly payouts';$('l2').textContent='+'+usd(v.pay);$('l3').textContent='+'+usd(v.share);
  $('why').innerHTML=(pr===prices[0]?C.good:C.bad).replace('{price}',usd(pr,0)).replace('{when}',C.when[n]).replace('{n}',n);
  $('shares').textContent=`${usd(a,0)} buys ${v.sh.toLocaleString('en-US')} shares at ${usd(C.price)} each: ${usd(v.cost)}.`;
  tl.querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('off',i>=n);b.classList.toggle('sel',i===sel);b.querySelector('.b').style.height=(v.mon[i]/(hmax*p_(v))*100*0.82+6)+'%';});
  $('tlnote').innerHTML=sel===null?`<b>${n} payouts</b> by ${C.when[n]}: <b>${usd(v.pay)}</b> in all.<br><span class="tiny">Then your money back and your share when it sells.</span>`
   :`${C.months[sel]} 20, ${sel===0?2026:2027}: <b>${usd(v.mon[sel])}</b>${sel>=n?' <span class="tiny">(only if it hasn&rsquo;t sold yet)</span>':''}`;
  $('sbput').textContent=usd(a,0);$('sbget').innerHTML='&rarr; '+usd(v.total);
  const mt=C.reserve.split('AMTX').join(encodeURIComponent(usd(a,0)));
  document.querySelectorAll('[data-reserve]').forEach(b=>{b.href=mt;if(b.classList.contains('sm'))return;b.textContent='Reserve my '+usd(a,0);});};
 const p_=v=>v.sh/10000;
 rng.addEventListener('input',()=>{a=+rng.value;res();});
 $('chips').addEventListener('click',e=>{const b=e.target.closest('button');if(b){a=+b.dataset.v;rng.value=a;res();}});
 $('segp').addEventListener('click',e=>{const b=e.target.closest('button');if(b){pr=+b.dataset.p;res();}});
 $('segm').addEventListener('click',e=>{const b=e.target.closest('button');if(b){n=+b.dataset.m;sel=null;res();}});
 tl.addEventListener('click',e=>{const b=e.target.closest('button');if(b){const i=+b.dataset.i;sel=sel===i?null:i;res();}});
 res();
 const sb=$('sb'),vis={hero:true,cta:false};const upd=()=>sb.classList.toggle('show',!vis.hero&&!vis.cta);
 if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(x=>{vis[x.target.id]=x.isIntersecting;upd();}),{threshold:0});io.observe($('hero'));io.observe($('cta'));
  const ro=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');x.target.querySelectorAll('.bt div').forEach(d=>d.style.width=d.dataset.w+'%');ro.unobserve(x.target);}}),{threshold:.12});
  document.querySelectorAll('.rv').forEach(s=>ro.observe(s));}
 else document.querySelectorAll('.rv').forEach(s=>{s.classList.add('in');s.querySelectorAll('.bt div').forEach(d=>d.style.width=d.dataset.w+'%');});
}
(async()=>{const box=document.getElementById('box');let P;
 try{P=await who();box.innerHTML=(await open_(b64(P.k),DATA.t[P.t])).split('{{FIRST}}').join(esc(P.n||'there'));}
 catch(e){box.innerHTML='<div id="msg">This page is private. Please open it from the button in Cleo&rsquo;s email, or reply to her and she&rsquo;ll send a fresh link.</div>';return;}
 interactive(P);
 ping(P.v);setTimeout(()=>{if(!document.hidden)ping(P.d);},20000);
 document.querySelectorAll('[data-act]').forEach(a=>a.addEventListener('click',()=>ping(P[a.dataset.act])));
 let left=0;document.querySelectorAll('[data-until]').forEach(a=>{if(Date.now()>Date.parse(a.dataset.until)-3600e3)a.remove();else left++;});
 if(!left){const q=document.querySelector('.callq');if(q)q.textContent='Rather talk first? Reply with a time and we’ll call you.';}
})();
</script></body></html>
