const PX='https://dtybhuhcuqybjipnfgcg.supabase.co/functions/v1/px/';
const ping=t=>{if(typeof t==='string'&&t.length===32&&!/[^0-9a-f]/.test(t))(new Image()).src=PX+t+'.gif?'+Date.now();};
const b64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sha=async s=>new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));
const hex=b=>Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
const open_=async(raw,blob)=>{const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(blob.iv)},k,b64(blob.ct)));};
async function who(){const i=(new URLSearchParams(location.search).get('i')||'').trim();
 if(i){const b=DATA.p[hex(await sha('id:'+i)).slice(0,16)];if(!b)throw 0;return JSON.parse(await open_(await sha('key:'+i),b));}
 const h=new URLSearchParams(location.hash.slice(1));if(h.get('k'))return Object.fromEntries(h);throw 0;}
// ---- money math: whole shares, card engine (rfacts.py) ----
const r2=x=>Math.round(x*100+1e-7)/100;
const SYM=String.fromCharCode(36);
const usd=(x,c)=>SYM+x.toLocaleString('en-US',c===0?{maximumFractionDigits:0}:{minimumFractionDigits:2,maximumFractionDigits:2});
function calc(C,a,price,n){
 const sh=Math.floor(a/C.price+1e-9),cost=r2(sh*C.price),left=r2(a-cost),f=cost/C.raise_total;
 const m_lo=r2(cost*C.rate1),m_hi=r2(cost*C.rate2),accr13=r2(3*cost*C.rate1);
 const mon=[0,0,0];for(let i=4;i<=24;i++)mon.push(m_lo);for(let i=25;i<=36;i++)mon.push(m_hi);
 const paid_mo=n===12?r2(9*cost*C.rate1):n===24?r2(21*cost*C.rate1):r2(21*cost*C.rate1+12*cost*C.rate2);
 const full_pay=n===12?r2(cost*12*C.rate1):n===24?r2(cost*24*C.rate1):r2(cost*(24*C.rate1+12*C.rate2));
 let pay,share,total,short=0,gu=0;
 if(String(price)===String(C.plan)){
  total=n===12?r2(C.v_m12_55*f):n===24?r2(C.v_m24_55*f):r2(cost+full_pay+r2(C.v_share36*f));
  pay=full_pay;share=r2(total-cost-pay);
 }else{
  if(n===12){short=r2(C.short12*f);gu=r2(C.gu12*f);pay=paid_mo;share=0;total=r2(cost+pay);}
  else if(n===24){short=r2(C.short24*f);gu=r2(C.gu24*f);pay=paid_mo;share=0;total=r2(cost+pay);}
  else{pay=full_pay;share=0;total=r2(cost+pay);}
 }
 return {sh,cost,left,mon,pay,share,total,short,gu,accr13};}
function tween(el,to,fmt){const from=el._cur??to,id=(el._id||0)+1;el._id=id;if(matchMedia('(prefers-reduced-motion:reduce)').matches||from===to){el._cur=to;el.textContent=fmt(to);return;}
 const t0=performance.now(),D=450;const step=t=>{if(el._id!==id)return;const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el._cur=k<1?from+(to-from)*e:to;el.textContent=fmt(k<1?r2(el._cur):to);if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}
function interactive(P){const C=JSON.parse(document.getElementById('cfg').textContent);const el=id=>document.getElementById(id);
 const mons=[12,24,36];let a=C.amount,n=36,sel=null;

 el('chips').innerHTML=C.chips.map(v=>'<button data-v="'+v+'">'+usd(v,0)+'</button>').join('');
 const sm={12:'early sale (yr 1)',24:'early sale (yr 2)',36:'the plan (yr 3)'};

 const tl=el('tl');
 tl.innerHTML=C.months.map((mo,i)=>{const lbl=(i===0||i===3||i===11||i===23||i===24||i===35)?(i+1):'';const yr=i===0?'Yr 1':i===12?'Yr 2':i===24?'Yr 3':'';return '<button data-i="'+i+'" class="'+(i<3?'accr':'')+'"><span class="yr">'+yr+'</span><span class="b"></span><span class="ml">'+lbl+'</span></button>';}).join('');
 const fill=(i,v)=>{tween(el('g'+i),v.total,x=>usd(x));el('n'+i).textContent='+'+usd(r2(v.total-v.cost))+' more than your shares cost';
  const W=x=>(x/v.total*100)+'%',s=el('k'+i).children;s[0].style.width=W(v.cost);s[1].style.width=W(v.pay);s[2].style.width=W(v.share);
  el('a'+i).textContent=usd(v.cost);el('t'+i).textContent=(i===2&&n<36?(n-3)+' monthly payouts':n+' months of payouts');el('b'+i).textContent='+'+usd(v.pay);el('c'+i).textContent='+'+usd(v.share);};
